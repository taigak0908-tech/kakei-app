<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わが家の家計簿</title>
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg:#0b0d10; --panel:#14171d; --panel2:#1b1f27; --panel3:#20242d;
    --ink:#eef1f6; --muted:#818b99; --faint:#5b6472;
    --amber:#ffb020; --amber2:#f7a531; --amber-dim:#5a441c;
    --warn:#ff5a52; --ok:#3ecf8e; --hair:rgba(255,255,255,.07);
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:14px 12px 90px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:460px}
  .tnum{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:16px;margin-bottom:12px}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
  .mark{display:flex;align-items:center;gap:8px}
  .mark .lamp{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber2)}
  .mark b{font-size:13.5px;font-weight:700;letter-spacing:.02em}
  .ysel{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--hair);border-radius:11px;padding:3px}
  .ysel button{appearance:none;border:0;background:transparent;color:var(--muted);width:30px;height:28px;border-radius:8px;font-size:17px;cursor:pointer;line-height:1}
  .ysel button:active{background:var(--panel3)}
  .ysel button:disabled{opacity:.25}
  .ysel .cur{min-width:66px;text-align:center;font-size:14px;font-weight:700}

  .monthbar{display:flex;gap:6px;overflow-x:auto;margin:0 2px 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .monthbar::-webkit-scrollbar{display:none}
  .monthbar .mc{flex:0 0 auto;font-size:12.5px;padding:6px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--hair);color:var(--muted);cursor:pointer;font-weight:600}
  .monthbar .mc.on{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.42);color:var(--amber)}

  .hero{position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber2),transparent);opacity:.7}
  .hero .lab{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .hero .lab .t{font-size:12.5px;color:var(--muted);font-weight:600}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .pill.live{background:rgba(255,176,32,.13);color:var(--amber);border:1px solid rgba(255,176,32,.3)}
  .pill.live .d{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:bl 1.6s infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
  .pill.up{background:rgba(255,90,82,.12);color:var(--warn);border:1px solid rgba(255,90,82,.28)}
  .pill.dn{background:rgba(62,207,142,.12);color:var(--ok);border:1px solid rgba(62,207,142,.28)}
  .hero .big{font-size:44px;font-weight:600;line-height:1;margin:2px 0 0;color:#fff}
  .hero .big .yen{font-size:24px;color:var(--muted);margin-right:3px;font-weight:500}
  .hero .sub{margin-top:9px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hero .sub .ref b{color:var(--ink);font-weight:600}

  .budget{margin-top:14px}
  .budget .btop{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;margin-bottom:6px}
  .budget .btop .k{color:var(--muted)}
  .budget .track{height:9px;border-radius:6px;background:var(--panel3);overflow:hidden}
  .budget .track > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ok),#2fae76);transition:width .4s}
  .budget .track > i.over{background:linear-gradient(90deg,#ff7a52,var(--warn))}
  .budget .set{margin-top:12px;display:flex;align-items:center;gap:8px;color:var(--amber);font-size:12.5px;font-weight:600;cursor:pointer}
  .budget .set .plus{width:22px;height:22px;border-radius:6px;background:rgba(255,176,32,.14);display:grid;place-items:center;font-size:15px}
  .budget .edit{margin-top:12px;display:none;gap:8px;align-items:center}
  .budget .edit.on{display:flex}
  .budget .edit input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--hair);border-radius:9px;color:var(--ink);padding:9px 11px;font-size:15px;font-family:var(--mono)}
  .budget .edit button{border:0;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .budget .edit .save{background:var(--amber);color:#1a1300}
  .budget .edit .clr{background:var(--panel3);color:var(--muted)}

  .warn-lamp{margin-top:13px;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid rgba(255,90,82,.22);border-radius:11px;padding:10px 12px}
  .warn-lamp.hidden{display:none}
  .warn-lamp .icon{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;background:rgba(255,90,82,.12);color:var(--warn);font-size:13px}
  .warn-lamp .tx{flex:1;min-width:0}
  .warn-lamp .tx .h{font-size:12px;color:var(--warn);font-weight:700}
  .warn-lamp .tx .p{font-size:11px;color:var(--muted);margin-top:1px}
  .warn-lamp .amt{font-weight:600;font-size:14px}

  .bd-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .bd-head .mo{font-size:11px;color:var(--faint)}
  .donut-wrap{display:flex;align-items:center;gap:16px;margin:6px 0 4px}
  .donut{flex:0 0 132px;position:relative;width:132px;height:132px}
  .donut svg{transform:rotate(-90deg)}
  .donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .donut .ctr .k{font-size:9.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  .donut .ctr .v{font-size:17px;font-weight:600;margin-top:2px}
  .donut .ctr .v .yen{font-size:12px;color:var(--muted)}
  .toplist{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .toplist .row{display:flex;align-items:center;gap:8px;font-size:12px}
  .toplist .row .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .toplist .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toplist .row .pc{color:var(--faint);font-size:11px}

  .catlist{margin-top:12px;border-top:1px solid var(--hair);padding-top:2px}
  .sortbar{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap;align-items:center}
  .sortbar .lbl{font-size:10px;color:var(--faint);margin-right:2px}
  .sortbar .sc{font-size:11px;padding:4px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--hair);color:var(--muted);cursor:pointer}
  .sortbar .sc.on{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.4);color:var(--amber);font-weight:700}
  .cat{padding:9px 2px;border-bottom:1px solid var(--hair);cursor:pointer}
  .cat:last-child{border-bottom:0}
  .cat .line{display:flex;align-items:center;gap:9px}
  .cat .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .cat .dot.hatch{background:repeating-linear-gradient(45deg,var(--warn) 0 2px,transparent 2px 4px);border:1px solid rgba(255,90,82,.5)}
  .cat .nm{flex:1;font-size:13px}
  .cat .nm .w{font-size:10px;color:var(--warn);margin-left:6px;font-weight:600}
  .cat .nm .chev{color:var(--faint);font-size:10px;margin-left:6px}
  .cat .amt{font-size:13px;font-weight:600}
  .cat .pc{font-size:11px;color:var(--faint);width:34px;text-align:right}
  .cat .bar{height:3px;border-radius:2px;background:var(--panel3);margin-top:7px;margin-left:19px;overflow:hidden}
  .cat .bar > i{display:block;height:100%;border-radius:2px}
  .cat .drill{margin:10px 0 3px 19px;display:none}
  .cat.open .drill{display:block}
  .cat .drill .hl{font-size:10px;color:var(--faint);margin-bottom:8px;letter-spacing:.04em}
  .shoprow{display:flex;align-items:center;gap:9px;padding:5px 0}
  .shoprow .sn{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shoprow .sbar{flex:0 0 46px;height:4px;border-radius:2px;background:var(--panel3);overflow:hidden}
  .shoprow .sbar > i{display:block;height:100%;border-radius:2px}
  .shoprow .sa{flex:0 0 auto;font-size:12px;font-weight:600;font-family:var(--mono)}
  .nodata{font-size:11.5px;color:var(--faint);padding:4px 0;line-height:1.6}

  .trend .eyebrow{margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:82px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;height:100%;justify-content:flex-end}
  .bars .b .col{width:100%;max-width:22px;background:var(--panel3);border-radius:4px 4px 2px 2px;min-height:3px}
  .bars .b.on .col{background:linear-gradient(180deg,var(--amber2),var(--amber-dim))}
  .bars .b .ml{font-size:9px;color:var(--faint)}
  .bars .b.on .ml{color:var(--amber)}
  .bars .b .mv{font-size:8px;color:var(--faint);height:10px}
  .bars .b.on .mv{color:var(--muted)}

  .foot{text-align:center;font-size:10.5px;color:var(--faint);line-height:1.7;margin-top:2px}
  .foot b{color:var(--muted);font-weight:600}
  .foot .lnk{color:var(--muted);text-decoration:underline;cursor:pointer}

  .txrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--hair);font-size:12.5px}
  .txrow:last-child{border-bottom:0}
  .txrow .td{color:var(--faint);font-family:var(--mono);font-size:11px;flex:0 0 36px}
  .txrow .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .txrow .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .txrow .tn .tg{color:var(--faint);font-size:10.5px;margin-left:6px}
  .txrow .ta{font-weight:600}
  .txrow .tdel{appearance:none;border:0;background:var(--panel3);color:var(--muted);width:24px;height:24px;border-radius:7px;cursor:pointer;font-size:11px;flex:0 0 auto}

  .fab{position:fixed;right:18px;bottom:20px;width:54px;height:54px;border-radius:50%;border:0;background:var(--amber);color:#1a1300;font-size:28px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(255,176,32,.35);z-index:30;line-height:1}
  .fab:active{transform:scale(.94)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:460px;background:var(--panel2);border:1px solid var(--hair);border-radius:18px 18px 0 0;padding:18px 16px 26px;z-index:50;transition:transform .25s}
  .sheet.on{transform:translate(-50%,0)}
  .sheet .sh-title{font-size:14px;font-weight:700;margin-bottom:12px}
  .sheet label{display:block;font-size:11px;color:var(--muted);margin-bottom:10px}
  .sheet input,.sheet select{display:block;width:100%;margin-top:4px;background:var(--panel);border:1px solid var(--hair);border-radius:9px;color:var(--ink);padding:10px 11px;font-size:15px;color-scheme:dark}
  .sheet .sh-btns{display:flex;gap:8px;margin-top:14px}
  .sheet .sh-btns button{flex:1;border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
  .sheet .sh-btns .save{background:var(--amber);color:#1a1300}
  .sheet .sh-btns .clr{background:var(--panel3);color:var(--muted)}

  .lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .lock .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:26px 22px;text-align:center}
  .lock .lamp{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber2);margin:0 auto 12px}
  .lock h1{font-size:16px;margin:0 0 4px;font-weight:700}
  .lock p{font-size:11.5px;color:var(--muted);margin:0 0 16px;line-height:1.6}
  .lock input{display:block;width:100%;background:var(--panel2);border:1px solid var(--hair);border-radius:10px;color:var(--ink);padding:12px;font-size:16px;text-align:center;margin-bottom:10px}
  .lock button{width:100%;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;background:var(--amber);color:#1a1300}
  .lock .err{font-size:11.5px;color:var(--warn);margin-top:10px;min-height:16px}
.wtag{display:inline-block;font-size:10px;line-height:1.5;border:1px solid #e6c34a;color:#e6c34a;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="lock" id="lock" style="display:none">
  <div class="box">
    <div class="lamp"></div>
    <h1>わが家の家計簿</h1>
    <p>合言葉を入力してください。<br>この端末では次回から入力不要になります。</p>
    <input type="password" id="lockPass" placeholder="合言葉" autocomplete="current-password">
    <button id="lockBtn">開く</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>
<div class="wrap">
  <div class="topbar">
    <div class="mark"><span class="lamp"></span><b>わが家の家計簿</b></div>
    <div class="ysel">
      <button id="py">‹</button><div class="cur" id="curYear"></div><button id="ny">›</button>
    </div>
  </div>
  <div class="monthbar" id="monthbar"></div>

  <div class="panel hero">
    <div class="lab"><span class="t" id="heroLab"></span><span id="heroPill"></span></div>
    <div class="big tnum"><span class="yen">¥</span><span id="heroAmt">0</span></div>
    <div class="sub" id="heroSub"></div>
    <div class="budget" id="budget"></div>
    <div class="warn-lamp hidden" id="warnLamp">
      <div class="icon">▲</div>
      <div class="tx"><div class="h">要確認 — 分類が未確定</div><div class="p" id="warnP"></div></div>
      <div class="amt tnum" id="warnAmt"></div>
    </div>
  </div>

  <div class="panel">
    <div class="bd-head"><div class="eyebrow">内訳 · タップで店舗別</div><div class="mo" id="bdMo"></div></div>
    <div class="donut-wrap">
      <div class="donut">
        <svg width="132" height="132" viewBox="0 0 132 132">
          <defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="#2a1414"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#ff5a52" stroke-width="2.4"></line>
          </pattern></defs>
          <circle cx="66" cy="66" r="52" fill="none" stroke="#20242d" stroke-width="15"></circle>
          <g id="arcs"></g>
        </svg>
        <div class="ctr"><div class="k">合計</div><div class="v tnum"><span class="yen">¥</span><span id="donutTotal">0</span></div></div>
      </div>
      <div class="toplist" id="toplist"></div>
    </div>
    <div class="sortbar" id="sortbar"></div>
    <div class="catlist" id="catlist"></div>
  </div>

  <div class="panel trend">
    <div class="eyebrow">推移（直近12ヶ月）</div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="panel">
    <div class="bd-head"><div class="eyebrow">手入力の明細</div><div class="mo" id="txMo"></div></div>
    <div id="txlist"></div>
  </div>

  <div class="foot">
    取込データ最終更新 <b>2026/7/20</b><span id="footAdd"></span> · 手入力 <b id="footTx">0</b>件<br>
    データはこの端末のブラウザに保存されます<br>
    <span class="lnk" id="addBtn">追加分を読み込み</span><span id="addClrWrap" style="display:none"> · <span class="lnk" id="addClr">追加分を消す</span></span><br>
    <span class="lnk" id="codeCopy">引き継ぎコードをコピー</span> · <span class="lnk" id="codePaste">引き継ぎコードを読み込み</span><br>
    <span class="lnk" id="expBtn">バックアップ書き出し</span> · <span class="lnk" id="impBtn">バックアップ読み込み</span><br>
    <span class="lnk" id="syncBtn">同期をつなぐ</span> · <span id="syncState"></span><br>
    <span id="bkWarn" style="display:none;color:#c0392b"></span>
    <input type="file" id="impFile" accept=".json,application/json" style="display:none">
    <input type="file" id="addFile" accept=".json,application/json" style="display:none">
  </div>
</div>

<button class="fab" id="fabAdd" title="支出を記録">＋</button>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sh-title">支出を記録</div>
  <label>日付<input type="date" id="fDate"></label>
  <label>金額（円）<input type="number" id="fAmt" inputmode="numeric" min="1" placeholder="例: 1200"></label>
  <label>カテゴリ<select id="fGenre"></select></label>
  <label id="fGenreNewWrap" style="display:none">新しいカテゴリ名<input type="text" id="fGenreNew" placeholder="例: 教育費"></label>
  <label>店名・メモ（任意）<input type="text" id="fShop" placeholder="例: カネスエ"></label>
  <div class="sh-btns"><button class="save" id="fSave">保存</button><button class="clr" id="fCancel">キャンセル</button></div>
</div>

let SEED = null;
let COLORS = {};
const PALETTE = ['#4a9eff','#3ecf8e','#ffab3d','#b18cff','#ff9ec4','#c08a5a','#e6c34a','#ff7a6b','#6c8cff','#57c98b','#5bb3ff','#ff7a3d'];
const dynColor = {};
const col = g => { if(COLORS[g]) return COLORS[g]; if(!dynColor[g]){ let h=0; for(let i=0;i<g.length;i++) h=(h*31+g.charCodeAt(i))>>>0; dynColor[g]=PALETTE[h%PALETTE.length]; } return dynColor[g]; };
const yen = n => Math.round(n).toLocaleString('ja-JP');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
const LS_TX = 'kakei:tx:v1', LS_PREFS = 'kakei:prefs:v1', LS_ADD = 'kakei:add:v1';
let TX = [];
let ADD = { months: {}, at: {} };   // 月単位の追加取込（同じ月はこちらで置き換え）。at は月ごとの更新時刻（同期で新しい方を残す）
const LS_SYNC = 'kakei:sync:v1', LS_DEL = 'kakei:del:v1';
let DEL = {};   // 消した手入力行の墓標 {id: 消した時刻}
let SYNC = { pushed: {} };   // 同期の設定と記録 { url, token, lastAt, pushed, lastPull }（URL と合言葉はこの端末にだけ持つ）
let prefs = { budget: null, lastYm: null };
let MONTHS = [], SHOP = {}, YEARS = [];
let idx = 0;
let ymode = false;

function loadAll(){
  try{ const t = JSON.parse(localStorage.getItem(LS_TX)||'[]'); if(Array.isArray(t)) TX = t; }catch(e){}
  try{ const p = JSON.parse(localStorage.getItem(LS_PREFS)||'null'); if(p && typeof p==='object') prefs = Object.assign(prefs, p); }catch(e){}
  try{ const a = JSON.parse(localStorage.getItem(LS_ADD)||'null'); if(a && a.months){ ADD = a; if(!ADD.at || typeof ADD.at!=='object') ADD.at = {}; } }catch(e){}
  try{ const d = JSON.parse(localStorage.getItem(LS_DEL)||'null'); if(d && typeof d==='object') DEL = d; }catch(e){}
  try{ const s = JSON.parse(localStorage.getItem(LS_SYNC)||'null'); if(s && typeof s==='object') SYNC = s; }catch(e){}
  if(!SYNC.pushed || typeof SYNC.pushed!=='object') SYNC.pushed = {};
}
function saveAdd(){ try{ localStorage.setItem(LS_ADD, JSON.stringify(ADD)); }catch(e){ alert('保存できませんでした。ブラウザのストレージ設定を確認してください。'); } syncSoon(); }
const addCount = () => Object.keys(ADD.months||{}).length;
function saveTx(){ try{ localStorage.setItem(LS_TX, JSON.stringify(TX)); }catch(e){ alert('保存できませんでした。ブラウザのストレージ設定を確認してください。'); } syncSoon(); }
function saveDel(){ try{ localStorage.setItem(LS_DEL, JSON.stringify(DEL)); }catch(e){} }
function saveSync(){ try{ localStorage.setItem(LS_SYNC, JSON.stringify(SYNC)); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); }catch(e){} }

// 取込済みデータ(SEED)と手入力(TX)をマージして表示用のMONTHS/SHOPを作る
function buildData(){
  const map = {};
  SEED.months.forEach(m=>{ const g={}; (m.g||[]).forEach(([k,a,c])=>g[k]=[a,c]); map[m.ym]={ym:m.ym,y:m.y,m:m.m,total:m.total,cnt:m.cnt,g}; });
  SHOP = {};
  for(const ym in SEED.shop){ SHOP[ym]={}; for(const g in SEED.shop[ym]) SHOP[ym][g]=SEED.shop[ym][g].map(r=>r.slice()); }
  // 追加取込ぶんで同じ月をまるごと置き換える（ほかの月はそのまま）
  for(const ym in (ADD.months||{})){
    const a=ADD.months[ym], g={};
    (a.g||[]).forEach(([k,amt,c])=>g[k]=[amt,c]);
    map[ym]={ ym, y:+ym.slice(0,4), m:+ym.slice(5,7), total:a.total, cnt:a.cnt, g, note:a.note||'' };
    SHOP[ym]={};
    for(const gg in (a.shop||{})) SHOP[ym][gg]=a.shop[gg].map(r=>r.slice());
  }
  TX.forEach(t=>{
    const ym=t.date.slice(0,7);
    if(!map[ym]) map[ym]={ym,y:+ym.slice(0,4),m:+ym.slice(5,7),total:0,cnt:0,g:{}};
    const M=map[ym]; M.total+=t.amount; M.cnt++;
    if(!M.g[t.genre]) M.g[t.genre]=[0,0];
    M.g[t.genre][0]+=t.amount; M.g[t.genre][1]++;
    if(!SHOP[ym]) SHOP[ym]={};
    if(!SHOP[ym][t.genre]) SHOP[ym][t.genre]=[];
    const nm=t.shop||'手入力';
    const row=SHOP[ym][t.genre].find(r=>r[0]===nm);
    if(row){ row[1]+=t.amount; row[2]++; } else SHOP[ym][t.genre].push([nm,t.amount,1]);
    SHOP[ym][t.genre].sort((a,b)=>b[1]-a[1]);
  });
  const cy=todayStr().slice(0,7);
  if(!map[cy]) map[cy]={ym:cy,y:+cy.slice(0,4),m:+cy.slice(5,7),total:0,cnt:0,g:{}};
  MONTHS = Object.values(map).map(M=>({ym:M.ym,y:M.y,m:M.m,total:M.total,cnt:M.cnt,cur:M.ym===cy,note:M.note||'',g:Object.keys(M.g).map(k=>[k,M.g[k][0],M.g[k][1]]).sort((a,b)=>b[1]-a[1])}));
  MONTHS.sort((a,b)=>b.ym.localeCompare(a.ym));
  YEARS = [...new Set(MONTHS.map(m=>m.y))].sort((a,b)=>b-a);
}

function yearAgg(y){

  const g=Object.keys(gm).map(k=>[k,gm[k][0],gm[k][1]]).sort((a,b)=>b[1]-a[1]);
  return {y, ym:y+'-ALL', total, cnt, g, year:true};
}

    for(const name in src){
      const d=src[name];
      const amt=(d.amt!=null?d.amt:(d.total!=null?d.total:0))|0;
      const c=(d.cnt!=null?d.cnt:0)|0;
      g.push([name,amt,c]); total+=amt; cnt+=c;
      const ss=d.shops||{}, rows=[];
      for(const sn in ss){ const sv=ss[sn];
        rows.push([sn, Array.isArray(sv)?sv[0]:sv.amt, (Array.isArray(sv)?sv[1]:sv.cnt)||0]); }
      rows.sort((a,b)=>b[1]-a[1]);
      if(rows.length) shop[name]=rows;
    }
    g.sort((a,b)=>b[1]-a[1]);
    out[ym]={ total:(v.total!=null?v.total:total), cnt:(v.cnt!=null?v.cnt:cnt), g, shop, note:v.note||'' };
  };
  if(j.month && (j.genres||j.g)) put(j.month, j);
  const src=j.months||j;
  for(const k in src){ const v=src[k]; if(v && typeof v==='object' && (v.genres||v.g)) put(k,v); }
  return out;
}

// バックアップ・引き継ぎコードで追加分をまるごと置き換える。前後どちらかにある月は今の時刻にして、同期で古い中身に戻らないようにする
function addReplace(na){
  const now=Date.now(), nm=na.months||{}, at=Object.assign({}, ADD.at||{}, (na.at&&typeof na.at==='object')?na.at:{});
  Object.keys(ADD.months||{}).concat(Object.keys(nm)).forEach(k=>at[k]=now);
  ADD={months:nm, at};
}

// ---- 復号と起動 ----
const KEY_CACHE='kakei:key:v1';
let KEY=null;   // 開いた鍵（SEED の復号と、同期の塊の暗号に使う）
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function b64e(buf){ const a=new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); }
async function decryptSeed(key){
  const data=b64d(SEED_ENC), iv=data.slice(16,28), ct=data.slice(28);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlockWithPass(pass){
  const data=b64d(SEED_ENC), salt=data.slice(0,16);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  SEED=await decryptSeed(key); KEY=key;
  try{ localStorage.setItem(KEY_CACHE, b64e(await crypto.subtle.exportKey('raw',key))); }catch(e){}
}
async function tryCachedKey(){
  const k=localStorage.getItem(KEY_CACHE); if(!k) return false;
  try{ const key=await crypto.subtle.importKey('raw',b64d(k),'AES-GCM',false,['encrypt','decrypt']); SEED=await decryptSeed(key); KEY=key; return true; }
  catch(e){ localStorage.removeItem(KEY_CACHE); return false; }
}

/* ---------- バックアップの催促（2026-09-16 追加） ----------
   書き出した日を端末に覚えておき、7日を超えたら足もとに出すだけ。外へは何も送らない。 */
const LS_BK='kakei:lastbk:v1', BK_DAYS=7;
function bkMark(){ try{ localStorage.setItem(LS_BK, String(Date.now())); }catch(e){} bkShow(); }
function bkShow(){
  const el=document.getElementById('bkWarn'); if(!el) return;
  let v=0; try{ v=parseInt(localStorage.getItem(LS_BK)||'0',10)||0; }catch(e){}
  if(!v){ bkMark(); return; }
  const d=Math.floor((Date.now()-v)/86400000);
  if(d>=BK_DAYS){ el.style.display=''; el.innerHTML='前回のバックアップから'+d+'日です。上の「バックアップ書き出し」を押して、ドライブに保存してください。<br>'; }
  else el.style.display='none';
}

/* ---------- 端末どうしの同期（2026-10-05 追加） ----------
   手入力(TX)・墓標(DEL)・追加分(ADD)を合言葉の鍵で暗号化した「塊」にして受け口（Apps Script）に置き、
   くらしカレンダーとは1行ずつ行き来する（混ぜ方は sync.js）。つないでいない端末では何もしない。
   受け口の URL と合言葉はこの端末の localStorage にだけ持つ。通信の失敗は黙って次の機会に回す。 */
const isCal=t=>!!t&&t.src==='cal';
const nonCal=a=>(a||[]).filter(t=>!isCal(t));
let syncBad=false, syncTimer=null, syncRemoteAt=0, syncQ=Promise.resolve();
function syncSerial(fn){ const p=syncQ.then(fn); syncQ=p.catch(()=>{}); return p; }   // 取ると送るを同時に走らせない
async function encryptSync(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(obj)));
  const out=new Uint8Array(12+ct.byteLength); out.set(iv); out.set(new Uint8Array(ct),12);
  return b64e(out);
}
async function decryptSync(s){
  try{ const b=b64d(s); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12)); return JSON.parse(new TextDecoder().decode(pt)); }
  catch(e){ return null; }
}
async function callSync(action, body){
  const p=Object.assign({action}, action==='kakei_pair'?{}:{token:SYNC.token}, body||{});   // つなぐときは合言葉を送らない
  const res=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
  const j=await res.json();
  if(!j||!j.ok) throw new Error((j&&j.error)||'受け口がエラーを返しました');
  return j;
}
const syncReady=()=>!!(SYNC.url&&SYNC.token&&KEY&&SEED);
function syncShow(){
  const el=$('syncState'); if(!el) return;
  if(!SYNC.url||!SYNC.token){ el.textContent='同期：未設定'; return; }
  if(syncBad){ el.textContent='同期：読めません（つなぎ直してください）'; return; }
  const t=Math.max(SYNC.lastAt||0, SYNC.lastPull||0);
  el.textContent=t?'同期：'+Math.max(0,Math.floor((Date.now()-t)/60000))+'分前':'同期：まだ';
}
function syncRedraw(){ const keep=MONTHS[idx]&&MONTHS[idx].ym; buildData(); const i=keep?mIndexByYm(keep):-1; idx=i>=0?i:0; render(); }
const asState=o=>({ tx:nonCal(o&&o.tx), del:(o&&o.del)||{}, add:(o&&o.add)||{months:{},at:{}} });
// 取ってきた塊（復号済み。読めない・無いときは null）とカレンダーの行を手元に混ぜる
function syncTake(remote, calRows){
  let ch=false;
  if(remote){
    // 塊にある行は、それを置いた端末がカレンダーへ送り済み。二重に送らず、ここで消したときに消しを送れるよう記録する
    nonCal(remote.tx).forEach(t=>{ if(t&&t.id!=null) SYNC.pushed[t.id]=true; });
    const m=KakeiSync.mergeState(asState({tx:TX,del:DEL,add:ADD}), asState(remote));
    if(m.changed){ TX=m.tx.concat(TX.filter(isCal)); DEL=m.del; ADD=m.add; ch=true; }
  }
  if(Array.isArray(calRows)){ const c=KakeiSync.applyCalRows(TX, calRows); if(c.changed){ TX=c.tx; ch=true; } }
  saveSync();
  if(ch){ saveDel(); saveAdd(); saveTx(); syncRedraw(); }
}
async function syncPullNow(){
  if(!syncReady()) return syncShow();
  try{
    const r=await callSync('kakei_get',{});
    let remote=null;
    if(r.blob&&r.blob.data){
      syncRemoteAt=Math.max(syncRemoteAt, +r.blob.at||0);
      remote=await decryptSync(r.blob.data);
      syncBad=!remote;
    } else syncBad=false;
    syncTake(remote, r.calRows);
    SYNC.lastPull=Date.now(); saveSync();
    // 手元にしか無いもの（送り損ねた分）があれば送る。読めない塊は勝手に上書きしない
    if(!syncBad){ const R=remote?asState(remote):asState(null);
      if(KakeiSync.mergeState(R, asState({tx:TX,del:DEL,add:ADD})).changed) syncSoon(); }
  }catch(e){ console.warn('同期：取れませんでした', e); }
  syncShow();
}
async function syncPushNow(){
  if(!syncReady()) return syncShow();
  try{
    if(!nonCal(TX).length){
      // 手元が空のときは、向こうにある行を空で上書きしないよう先に取って混ぜる（全部消した結果の空なら送る）
      const g=await callSync('kakei_get',{});
      const remote=(g.blob&&g.blob.data)?await decryptSync(g.blob.data):null;
      if(g.blob) syncRemoteAt=Math.max(syncRemoteAt, +g.blob.at||0);
      if(remote && !KakeiSync.shouldPush(nonCal(TX), nonCal(remote.tx))
         && nonCal(KakeiSync.mergeState(asState({tx:TX,del:DEL,add:ADD}), asState(remote)).tx).length){
        syncBad=false; syncTake(remote, g.calRows); SYNC.lastPull=Date.now(); saveSync(); return syncShow();
      }
    }
    const tx=nonCal(TX), d=KakeiSync.diffPushed(tx, DEL, SYNC.pushed), at=Math.max(Date.now(), syncRemoteAt+1);
    const data=await encryptSync({ver:1, at, tx, del:DEL, add:ADD});
    const r=await callSync('kakei_put',{blob:{at,data}, rows:{add:d.add, del:d.del}});
    SYNC.pushed=d.pushed; SYNC.lastAt=at; syncRemoteAt=Math.max(syncRemoteAt, at); syncBad=false; saveSync();
    syncTake(null, r.calRows);
  }catch(e){ console.warn('同期：送れませんでした', e); }
  syncShow();
}
function syncPull(){ return syncSerial(syncPullNow); }
function syncPush(){ return syncSerial(syncPushNow); }
function syncSoon(){ if(!SYNC.url||!SYNC.token) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>{ syncTimer=null; syncPush(); },3000); }
async function syncConnect(){
  const url=(prompt('受け口のURL', SYNC.url||'')||'').trim(); if(!url) return;
  const code=(prompt('6桁コード')||'').trim(); if(!code) return;
  const ok=await syncSerial(async()=>{
    const prev=SYNC.url;
    try{
      if(!/^https:\/\//.test(url)) throw new Error('URL は https:// で始まるものを入れてください');
      SYNC.url=url;
      const r=await callSync('kakei_pair',{code});
      if(!r.token) throw new Error('合言葉が返ってきませんでした');
      SYNC.token=r.token; syncBad=false; saveSync(); return true;
    }catch(e){ SYNC.url=prev; console.warn('同期：つなげませんでした', e); return false; }
  });
  if(!ok){ $('syncState').textContent='同期：つなげませんでした（URL とコードを確かめてください）'; return; }
  await syncPull();
}
$('syncBtn').onclick=()=>syncConnect();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') syncPull();
  else if(syncTimer){ clearTimeout(syncTimer); syncTimer=null; syncPush(); }   // 閉じる前に待ちの分を送る
});
addEventListener('online',()=>syncPull());
setInterval(syncShow, 60000);

function startApp(){
  COLORS=SEED.colors;
  loadAll(); buildData();
  if(prefs.lastYm){ const i=mIndexByYm(prefs.lastYm); if(i>=0) idx=i; }
  if(prefs.ymode) ymode=true;
  render();
  $('lock').style.display='none';
  bkShow();
  syncShow(); syncPull();
}
function showLock(){
  $('lock').style.display='flex';
  const go=async()=>{
    const p=$('lockPass').value.trim();
    if(!p) return;
    $('lockBtn').disabled=true; $('lockErr').textContent='確認中…';
    try{ await unlockWithPass(p); $('lockErr').textContent=''; startApp(); }
    catch(e){ $('lockErr').textContent='合言葉が違います'; }
    $('lockBtn').disabled=false;
  };
  $('lockBtn').onclick=go;
  $('lockPass').onkeydown=e=>{ if(e.key==='Enter') go(); };
  setTimeout(()=>$('lockPass').focus(),100);
}
(async()=>{
  if(!(window.crypto&&crypto.subtle)){ $('lock').style.display='flex'; $('lockErr').textContent='このページはhttps（公開URL）またはlocalhostで開いてください'; return; }
  if(await tryCachedKey()) startApp(); else showLock();
})();
if('serviceWorker' in navigator) addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
